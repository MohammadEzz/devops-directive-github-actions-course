name: Passing Variables Between jobs
on:
  workflow_dispatch:

jobs:
  producer:
    runs-on: ubuntu-24.04

    outputs:
      foo: ${{ steps.generate-foo.outputs.foo }}
    steps:
      - name: Generate and export foo
        id: generate-foo
        run: |
          foo=bar

          # 1) Step output (for job output)
          echo "foo=${foo}" >> "$GITHUB_OUTPUT"

          # 2) Job-scoped environment variable
          echo "FOO=${foo}" >> "$GITHUB_ENV"

      - name: Inspect values inside producer
        run: |
          echo "FOO (set via GITHUB_ENV):   $FOO"
          echo "foo (step output):          ${{ steps.generate-foo.outputs.foo }}"

  middleman:
    runs-on: ubuntu-24.04
    needs: producer
    outputs:
      status: ${{ steps.middleman-step.outputs.status }}
    steps:
      - name: Inspect values inside middleman (note FOO is unset)
        id: middleman-step
        run: |
          status=active
          echo "status=${status}" >> "$GITHUB_OUTPUT"
  consumer:
    runs-on: ubuntu-24.04
    needs: 
      - middleman 
      - producer
    steps:
      - name: Inspect values inside consumer (note FOO is unset)
        run: |
          echo "Value from middleman:       ${{ needs.middleman.outputs.status }}"
          echo "FOO in consumer:            ${{ needs.producer.outputs.foo }}"
